<script>
'use strict';
const $=s=>document.querySelector(s),r=n=>Math.floor(Math.random()*n),pick=a=>a[r(a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5);
const colors={purple:'#a17be4',blue:'#58bde0',pink:'#f18db2',green:'#79c98b',orange:'#f6af65',red:'#e88080',black:'#526473'};
const nums=['zero','one','two','three','four','five','six','seven','eight','nine'];
const parts=['eyes','arms','legs','ears','horns','tails'],singular={eyes:'eye',arms:'arm',legs:'leg',ears:'ear',horns:'horn',tails:'tail'};
const stages=[['🌿','Monster Scanner','微光森林','看清怪獸，找出真正的魔法！'],['🔮','Magic Sentence','魔法溪谷','選對 have / has，喚醒魔法。'],['🏔️','Build Your Attack','積木山丘','點選單字，組成你的攻擊！'],['🧪','Crazy Monster Lab','怪獸實驗室','描述奇怪的朋友，讓牠跳舞！'],['🤖','Teacher Trap','機器人工坊','英文機器人壞掉了，幫牠修好！'],['🌋','Final Boss','水晶火山','用你的英文，找回最後的光！']];
let cfg={difficulty:'Normal',questions:5,sound:true},s,timer=null,audio=null,toastTimer;
function reset(){clearTimeout(timer);$('#modal').innerHTML='';s={view:'start',stage:0,unlocked:0,hp:100,exp:0,coins:0,crystals:0,combo:0,maxCombo:0,correct:0,attempts:0,defeated:0,skipped:0,manual:0,round:0,enemyHP:100,enemyMax:100,q:null,solved:false,selected:[],locked:false,bonusDone:false,loot:null};renderStart();hud()}
function monster(crazy=false){let m={color:pick(Object.keys(colors)),subject:pick(['He','She'])};for(const p of parts)m[p]=1+r(crazy?5:3);m.eyes=1+r(crazy?7:4);return m}
function svg(m){const c=colors[m.color];let out=`<svg viewBox="0 0 360 330" role="img" aria-label="${m.color} monster"><ellipse cx="180" cy="308" rx="116" ry="13" fill="#193d4b" opacity=".12"/>`;
for(let i=0;i<m.tails;i++)out+=`<path d="M245 ${225+i*7} Q${322+i*5} ${255-i*25} ${313+i*7} ${155+i*26}" fill="none" stroke="#254957" stroke-width="15" stroke-linecap="round"/><path d="M245 ${225+i*7} Q${322+i*5} ${255-i*25} ${313+i*7} ${155+i*26}" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round"/>`;
for(let i=0;i<m.legs;i++){let x=115+i*130/Math.max(1,m.legs-1);out+=`<path d="M${x} 252 v36 l-9 6" stroke="#254957" stroke-width="24" fill="none" stroke-linecap="round"/><path d="M${x} 252 v36 l-9 6" stroke="${c}" stroke-width="16" fill="none" stroke-linecap="round"/>`}
for(let i=0;i<m.arms;i++){let left=i%2===0,y=140+Math.floor(i/2)*38;out+=`<path d="M${left?101:259} ${y} Q${left?50:304} ${y+30} ${left?45:310} ${y-4}" fill="none" stroke="#254957" stroke-width="21" stroke-linecap="round"/><path d="M${left?101:259} ${y} Q${left?50:304} ${y+30} ${left?45:310} ${y-4}" fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round"/>`}
for(let i=0;i<m.ears;i++){let left=i%2===0,y=92+Math.floor(i/2)*32;out+=`<ellipse cx="${left?91:269}" cy="${y}" rx="21" ry="15" fill="${c}" stroke="#254957" stroke-width="5"/><ellipse cx="${left?87:273}" cy="${y}" rx="8" ry="6" fill="#ffd5c5"/>`}
out+=`<rect x="91" y="61" width="178" height="208" rx="78" fill="${c}" stroke="#254957" stroke-width="5"/><ellipse cx="159" cy="236" rx="39" ry="16" fill="white" opacity=".16"/>`;
for(let i=0;i<m.horns;i++){let x=117+i*126/Math.max(1,m.horns-1);out+=`<path d="M${x-9} 70 Q${x-7} 43 ${x+3} 26 L${x+12} 70Z" fill="${c}" stroke="#254957" stroke-width="4"/>`}
for(let i=0;i<m.eyes;i++){let row=Math.floor(i/4),count=Math.min(4,m.eyes-row*4),x=180+(i%4-(count-1)/2)*34,y=m.eyes>4?116+row*43:133;out+=`<circle cx="${x}" cy="${y}" r="16" fill="white" stroke="#254957" stroke-width="3"/><circle cx="${x+3}" cy="${y+2}" r="10" fill="${c}" stroke="#213c50" stroke-width="2"/><circle cx="${x+5}" cy="${y-1}" r="2" fill="white"/>`}
return out+`<path d="M150 193 Q180 221 211 193" fill="#613951" stroke="#254957" stroke-width="4"/><path d="M159 198 h13 l-5 10Z" fill="white"/><ellipse cx="126" cy="181" rx="13" ry="7" fill="#ffb5af" opacity=".7"/><ellipse cx="235" cy="181" rx="13" ry="7" fill="#ffb5af" opacity=".7"/></svg>`}
function hud(){let lv=1+Math.floor(s.exp/100);$('#hud').innerHTML=`<div class="level">LV ${lv}</div><div class="vitals"><small>❤️ HP ${s.hp} / 100</small><div class="bar"><div class="fill" style="width:${s.hp}%"></div></div></div><div class="vitals exp"><small>⭐ EXP ${s.exp%100} / 100</small><div class="bar"><div class="fill" style="width:${s.exp%100}%"></div></div></div><div class="hudstat">🪙 ${s.coins}</div><div class="hudstat">💎 ${s.crystals} / 5</div>`;$('#sound').textContent=cfg.sound?'🔊':'🔇'}
function sound(type){if(!cfg.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let ns=type==='wrong'?[230,180]:type==='victory'?[392,494,587,784]:type==='coin'?[740,988]:[440,660,880];ns.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(audio.destination);let t=audio.currentTime+i*.09;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
function renderStart(){s.view='start';$('#main').innerHTML=`<section class="start"><div class="startcopy"><span class="tag">✦ 一場用英文施展魔法的冒險</span><h1 class="title">MONSTER<br>ENGLISH<br><span style="color:#267e68">ADVENTURE</span></h1><h2>怪獸英文大冒險</h2><p>English Crystals 被怪獸偷走了！<br>走過五個區域，用你的魔法句子<br>找回水晶，挑戰火山大魔王。</p><button class="primary" id="start">Start Adventure ✦</button><p style="font-size:13px">先大聲說，再出招！ · 建議 30–45 分鐘</p></div><div class="heroart"><span class="crystal">💎</span><div class="float">${svg(monster())}</div><span class="tag">I / You have · He / She has</span></div></section>`;$('#start').onclick=()=>{sound('correct');renderMap()}}
function renderMap(){s.view='map';$('#main').innerHTML=`<div class="maphead"><div><div class="eyebrow">WORLD MAP · 水晶群島</div><h1 class="title" style="font-size:32px;margin-top:8px">下一站，冒險！</h1></div><span class="pill">💎 ${s.crystals} / 5</span></div><div class="map">${stages.map((st,i)=>`<button class="node ${i===s.unlocked?'active':''} ${i>s.unlocked?'locked':''}" data-stage="${i}" ${i!==s.unlocked?'disabled':''}><span class="icon">${i<s.unlocked?'💎':i>s.unlocked?'🔒':st[0]}</span><strong>${i===5?'FINAL BOSS':'0'+(i+1)} · ${st[2]}</strong><small>${st[1]}</small>${i===s.unlocked?'<small>點擊進入 ✦</small>':''}</button>`).join('')}</div><p class="legend">收集 5 顆水晶，打開火山之門。每一句英文，都是你的力量。</p>`;document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>startStage(+b.dataset.stage))}
function startStage(i){s.stage=i;s.round=0;s.target=cfg.questions;s.bonusDone=false;s.enemyMax=i===5?200:s.target*15;s.enemyHP=s.enemyMax;s.m=monster(i===3);s.view='battle';newQuestion()}
function phrase(m,p,subject=m.subject,forceColor=false){let n=m[p];return `${subject} ${['I','You'].includes(subject)?'have':'has'} ${nums[n]} ${cfg.difficulty==='Easy'&&!forceColor?'':m.color+' '}${n===1?singular[p]:p}.`}
function choice(prompt,answer,alts,extra={}){return {type:'choice',prompt,answer,options:shuffle([...new Set([answer,...alts])]),...extra}}
function makeQuestion(kind){let m=s.m,p=pick(parts.slice(0,cfg.difficulty==='Easy'?3:6)),subject=m.subject,answer=phrase(m,p);if(kind===0){let other={...m,[p]:m[p]%7+1};return choice('Which sentence is TRUE?',answer,[phrase(other,p),answer.replace(' has ',' have ')],{hint:'Look at the monster again! 數一數，再看看主詞。',part:p})}
if(kind===1){subject=['I','You','He','She'][s.round%4];let item=cfg.difficulty==='Hard'?pick(['two black cats','three red bags','one dog']):pick(['a cat','a dog','a red bag','two eyes']);return choice(`${subject} ___ ${item}.`,['I','You'].includes(subject)?'have':'has',['have','has'],{hint:`Look at the subject! ${subject} → ?`,subject})}
if(kind===2){if(cfg.difficulty==='Hard')subject=['I','You','He','She'][s.round%4];answer=phrase(m,p,subject);return {type:'build',prompt:'Build your attack! 點單字組句',answer,tokens:shuffle(answer.slice(0,-1).split(' ')),hint:'先選主詞，再選 have / has，接著描述身體。',part:p,subject}}
if(kind===3){p=['eyes','arms','color','legs','tails'][s.round%5];if(p==='color')return choice('Color? 看看怪獸的顏色。',`${m.subject} is ${m.color}.`,Object.keys(colors).filter(c=>c!==m.color).slice(0,2).map(c=>`${m.subject} is ${c}.`),{hint:'Look at the monster again!'});let other={...m,[p]:m[p]%7+1};return choice(`${p[0].toUpperCase()+p.slice(1)}? 描述你的怪獸！`,phrase(m,p),[phrase(other,p),phrase(m,p).replace(' has ',' have ')],{hint:'數一數身體部位，再選魔法句子。',part:p})}
let examples=[['He have three eyes.','He has three eyes.'],['She have a cat.','She has a cat.'],['He has two eye.','He has two eyes.'],['I has a dog.','I have a dog.'],['She has three cats.','She has three cats.']];let ex=examples[s.round%5];if(s.round>=5){let good=phrase(m,p);ex=[s.round%2?good:good.replace(' has ',' have '),good]}return {type:'trap',prompt:ex[0],answer:ex[1],valid:ex[0]===ex[1],phase:'judge',hint:'Check the subject! 也看看 one / two / three 後面的名詞。'}}
function newQuestion(){s.solved=false;s.locked=false;s.selected=[];s.feedback='';if(s.stage===5&&s.enemyHP<=20){s.q={type:'oral',prompt:'FINAL SPELL · 說出 3 句魔法！'};renderBattle();return}let kind=s.stage===5?s.round%5:s.stage;s.q=makeQuestion(kind);renderBattle()}
function renderBattle(){s.view='battle';let st=stages[s.stage],boss=s.stage===5;$('#main').innerHTML=`<div class="stagehead"><div><div class="eyebrow">${boss?'THE LAST CRYSTAL':`CHAPTER 0${s.stage+1} · ${st[2]}`}</div><h2>${st[0]} ${st[1]}</h2></div><span class="pill">${boss?(s.enemyHP<=20?'🔥 FINAL PHASE':'⚔ BOSS BATTLE'):`${Math.min(s.round+1,s.target)} / ${s.target}`}</span></div><section class="arena ${boss?'boss':''} ${boss&&s.enemyHP<=100?'rage':''} ${boss&&s.enemyHP<=20?'final':''} ${s.stage===3?'lab':''}" id="arena"><div class="combo">${s.combo>=2?'🔥 '+s.combo+' COMBO':'✦ READY TO CAST'}</div><div class="enemytitle">${boss?'CRYSTAL GUARDIAN':s.stage===4?'ROBOT’S MONSTER':s.m.subject.toUpperCase()+' · '+s.m.color.toUpperCase()+' MONSTER'} <span id="hptext">${s.enemyHP}/${s.enemyMax}</span><div class="bar"><div id="enemyfill" class="fill" style="width:${s.enemyHP/s.enemyMax*100}%"></div></div></div><div class="player float">🧙<div class="playername">YOU · LV ${1+Math.floor(s.exp/100)}</div></div><div class="enemy float" id="enemy">${svg(s.m)}</div><div class="groundlabel">${boss?'✦ 找回水晶的光':st[3]}</div></section><section class="question"><div class="qtop"><span>${s.q.type==='bonus'?'🎁 BONUS TREASURE':'YOUR SPELL · 你的回合'}</span><span>${s.m.subject} / ${s.m.subject==='He'?'男生怪獸':'女生怪獸'}</span></div><div id="qbody"></div><p id="feedback" class="feedback" role="status" aria-live="polite">${s.feedback||'先大聲說出句子，再施放魔法！'}</p><div id="nextrow" class="nextrow hidden"><p id="sayagain"></p><button class="primary" id="next">繼續冒險 ✦</button></div></section><div class="foot"><span>✧ I / You → have　·　He / She → has</span><span>不趕時間，勇敢說出來。</span></div>`;renderQuestion();$('#next').onclick=advance;hud()}
function renderQuestion(){let q=s.q,b=$('#qbody');if(q.type==='oral'){b.innerHTML=`<div class="prompt">${q.prompt}</div><div class="speech">Say 3 sentences about the monster!<br>1. ${s.m.subject} has __________.<br>2. ${s.m.subject} has __________.<br>3. ${s.m.subject} is __________.</div><p class="subtitle" style="color:#b9dcd8;margin:15px 0">說完後，請老師確認三句描述，再施放最後魔法。</p><button class="primary" id="oral">老師：Correct! Cast Spell ⚡</button>`;$('#oral').onclick=finalSpell;return}
if(q.type==='build'){b.innerHTML=`<div class="prompt">${q.prompt}</div><p style="color:#b9dcd8;margin-bottom:12px">${q.subject==='I'?'扮演怪獸，用 I 描述自己。':q.subject==='You'?'對著怪獸，用 You 描述牠。':'描述 '+q.subject+' 怪獸。'} · ${q.part}</p><div class="sentence" id="sentence" aria-label="你的句子"></div><div class="tokens" id="tokens"></div><button class="mint" id="cast" style="margin-top:15px">Cast Spell ⚡</button>`;drawTokens();$('#cast').onclick=()=>answerBuild();return}
if(q.type==='trap'){b.innerHTML=`<div class="prompt">🤖 “${q.prompt}”</div><p style="color:#b9dcd8;margin-bottom:16px">${q.phase==='judge'?'機器人說得對嗎？抓出英文 Bug！':'找到 Bug 了！哪一句可以修好機器人？'}</p><div class="options" id="options"></div>`;if(q.phase==='judge')setOptions(['✓ CORRECT','✕ WRONG'],i=>judge(i===0));else setOptions(shuffle([q.answer,q.prompt]),v=>submit(v===q.answer),true);return}
b.innerHTML=`<div class="prompt">${q.prompt}</div><div class="options" id="options"></div>`;setOptions(q.options,v=>submit(v===q.answer),true)}
function setOptions(a,fn,values=false){$('#options').innerHTML=a.map((v,i)=>`<button data-opt="${i}"><b>${String.fromCharCode(65+i)}</b>${v}</button>`).join('');document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(!s.solved&&!s.locked)fn(values?a[+b.dataset.opt]:+b.dataset.opt)})}
function drawTokens(){let q=s.q;$('#sentence').innerHTML=s.selected.map((id,i)=>`<button data-remove="${i}">${q.tokens[id]}</button>`).join('')||'<span style="color:#a3c3ca">點選下方單字；點已選單字可放回。</span>';$('#tokens').innerHTML=q.tokens.map((t,i)=>`<button data-token="${i}" ${s.selected.includes(i)||s.solved?'disabled':''}>${t}</button>`).join('');document.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{if(!s.solved){s.selected.push(+b.dataset.token);drawTokens()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!s.solved){s.selected.splice(+b.dataset.remove,1);drawTokens()}})}
function answerBuild(){if(s.solved||s.locked)return;if(s.selected.length!==s.q.tokens.length){$('#feedback').textContent='還有單字沒加入！點選全部單字，再施放魔法。';return}submit(s.selected.map(i=>s.q.tokens[i]).join(' ')+'.'===s.q.answer)}
function judge(correct){if(correct!==s.q.valid){wrong();return}if(s.q.valid){submit(true)}else{s.q.phase='fix';renderQuestion();$('#feedback').textContent='Nice catch! 選一句正確的英文，完成修理。'}}
function wrong(){s.attempts++;s.combo=0;s.hp=Math.max(0,s.hp-8);sound('wrong');$('#feedback').textContent=pick(['Almost! ','Try again! '])+(s.q.hint||'再看一次，勇敢試試！');$('#arena').classList.remove('shake');void $('#arena').offsetWidth;$('#arena').classList.add('shake');hud();$('.combo').textContent='✦ TRY AGAIN';if(s.hp===0){s.locked=true;$('#modal').innerHTML=`<div class="overlay"><div class="modal" style="text-align:center"><div style="font-size:65px">🧪</div><h2>Use a Magic Potion!</h2><p>魔法藥水永遠夠用，休息一下再出發！</p><button id="potion" class="mint">喝下藥水 · HP +100</button></div></div>`;$('#potion').onclick=()=>{s.hp=100;s.locked=false;$('#modal').innerHTML='';sound('correct');hud()}}}
function submit(ok,manual=false){if(s.solved||s.locked)return;if(!ok){wrong();return}s.solved=true;s.attempts++;s.correct++;if(manual)s.manual++;s.combo++;s.maxCombo=Math.max(s.maxCombo,s.combo);let oldLevel=Math.floor(s.exp/100);s.exp+=20;s.coins+=s.q.type==='bonus'?30:10;let dmg=s.combo>=5?35:s.combo>=3?20:s.combo===2?15:10;let beforeHP=s.enemyHP;if(s.q.type!=='bonus'){if(s.stage===5)s.enemyHP=Math.max(20,s.enemyHP-dmg);else s.enemyHP=Math.max(0,s.enemyHP-dmg);if(s.stage!==5&&s.round+1<s.target)s.enemyHP=Math.max(1,s.enemyHP);if(s.stage!==5&&s.round+1===s.target)s.enemyHP=0}if(s.q.type!=='bonus')dmg=beforeHP-s.enemyHP;sound(s.q.type==='bonus'?'coin':'correct');hud();$('#enemyfill').style.width=s.enemyHP/s.enemyMax*100+'%';$('#hptext').textContent=s.enemyHP+'/'+s.enemyMax;$('.combo').textContent='🔥 '+s.combo+' COMBO';let feedback=pick(['Awesome!','Great job!','Amazing!','Perfect!','Nice attack!']);$('#feedback').textContent=`${feedback} ${s.combo>=5?'⚡ CRITICAL HIT! ':''}+20 EXP · +${s.q.type==='bonus'?30:10} Coins`;$('#arena').insertAdjacentHTML('beforeend',`<div class="bolt">✨</div><div class="damage">${s.q.type==='bonus'?'+30 🪙':dmg+' DAMAGE!'}</div><div class="coinpop">🪙 +${s.q.type==='bonus'?30:10}</div>`);$('#enemy').classList.add(s.stage===3?'dance':'hit');$('#arena').classList.add('shake');document.querySelectorAll('#qbody button').forEach(b=>b.disabled=true);$('#nextrow').classList.remove('hidden');$('#sayagain').textContent=s.q.type==='bonus'?'寶藏到手！回到冒險。':`再說一次：${s.q.type==='choice'&&['have','has'].includes(s.q.answer)?s.q.prompt.replace('___',s.q.answer):s.q.answer}`;if(Math.floor(s.exp/100)>oldLevel)toast('⭐ LEVEL UP! LV '+(1+Math.floor(s.exp/100)))}
function advance(){if(!s.solved)return;if(s.q.type==='bonus'){s.round++;newQuestion();return}if(s.stage!==5&&s.round+1>=s.target){stageComplete();return}if(!s.bonusDone&&s.round===2){s.bonusDone=true;let bank=[['Which one is an animal?','dog',['red','circle']],['Which one is food?','apple',['blue','arm']],['Which one is a shape?','circle',['cat','mother']],['Which one is family?','sister',['seven','green']],['Which one is a color?','purple',['pizza','eye']],['Which number comes after two?','three',['one','five']]];let v=pick(bank);s.q=choice(v[0],v[1],v[2],{type:'bonus',hint:'想想以前學過的單字！'});s.solved=false;s.selected=[];s.feedback='🎁 Treasure! 回答加碼題，收集 30 金幣。';renderBattle();return}s.round++;newQuestion()}
function stageComplete(){s.crystals++;s.defeated++;s.unlocked=s.stage+1;s.view='reward';sound('victory');$('#main').innerHTML=`<section class="reward"><span class="bigicon">💎</span><div class="eyebrow">CRYSTAL RECOVERED</div><h1>${s.stage===3?'Monster Created!':'區域完成！'}</h1><p>${stages[s.stage][2]} 的水晶回來了！<br>跟老師說一句你最喜歡的魔法句子。</p>${s.stage===3?`<div class="dance" style="width:200px;margin:auto">${svg(s.m)}</div>`:''}<button class="primary" id="map">打開冒險地圖 🗺️</button></section>`;$('#map').onclick=renderMap;hud()}
function finalSpell(){if(s.solved||s.locked)return;s.solved=true;s.manual++;s.correct++;s.attempts++;s.exp+=50;s.coins+=100;s.enemyHP=0;s.defeated++;$('#oral').disabled=true;$('#enemyfill').style.width='0%';$('#hptext').textContent='0/200';$('#enemy').classList.remove('float');$('#enemy').classList.add('defeat');$('#arena').insertAdjacentHTML('beforeend','<div class="damage">⚡ FINAL SPELL!</div><div class="bolt">🌟</div>');sound('victory');hud();timer=setTimeout(victory,1300)}
function victory(){s.view='victory';let acc=s.attempts?Math.round(s.correct/s.attempts*100):0;$('#main').innerHTML=`<section class="reward"><span class="bigicon">🏆</span><div class="eyebrow">ALL CRYSTALS RESTORED</div><h1>MONSTER MASTER!</h1><div class="stars">⭐ ⭐ ⭐</div><p>你讓 Monster English World 恢復了光芒！<br>I have magic. You have magic, too!</p><h2>Today's Result</h2><div class="results">${[[s.correct,'Correct Answers'],[acc+'%','Accuracy'],[s.maxCombo,'Max Combo'],[s.coins,'Coins'],['+'+s.exp,'EXP'],[s.defeated,'Monsters Defeated']].map(v=>`<div class="result"><strong>${v[0]}</strong><span>${v[1]}</span></div>`).join('')}</div><p style="font-size:13px">答對次數 ÷ 作答次數（含重試與老師判定） · 跳過 ${s.skipped} 題 · 老師判定 ${s.manual} 題</p><button class="primary" id="chest">🎁 Open Treasure Chest</button><div id="loot" class="collection"></div><button class="mint" id="restart">Restart · 再冒險一次</button></section>`;$('#chest').onclick=()=>{if(s.loot)return;s.loot=pick(['🗡️ Magic Sword','🥚 Dragon Egg','👑 Golden Crown','🌈 Rainbow Potion','🐣 Mystery Pet']);$('#loot').textContent='你的冒險收藏：'+s.loot;$('#chest').disabled=true;$('#chest').textContent='✨ Treasure collected!';sound('coin')};$('#restart').onclick=reset}
function teacher(){if(s.locked)return;$('#modal').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="Teacher controls"><h2>⚙ Teacher</h2><p>每題先讓孩子說出完整句子。可加問「What about the arms?」延伸口說；建議每區 5–7 分鐘。</p><label>Difficulty <select id="difficulty">${['Easy','Normal','Hard'].map(v=>`<option ${cfg.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Questions per stage <select id="count">${[3,5,8].map(v=>`<option ${cfg.questions===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Sound <select id="soundsetting"><option value="on" ${cfg.sound?'selected':''}>ON</option><option value="off" ${!cfg.sound?'selected':''}>OFF</option></select></label><p>難度從下一題套用；題數從下一區套用。Boss 有 200 HP，最後三句由老師判定。Skip 不會傷害 Boss 或算答對。</p><div class="actions"><button id="skip" ${s.view!=='battle'||s.solved||s.q?.type==='oral'?'disabled':''}>Skip Question</button><button class="mint" id="manual" ${s.view!=='battle'||s.solved?'disabled':''}>Correct · 口說判定</button></div><button class="primary" id="close">完成 / 回到遊戲</button></section></div>`;$('#difficulty').onchange=e=>cfg.difficulty=e.target.value;$('#count').onchange=e=>cfg.questions=+e.target.value;$('#soundsetting').onchange=e=>{cfg.sound=e.target.value==='on';hud()};$('#close').onclick=()=>$('#modal').innerHTML='';$('#skip').onclick=()=>{$('#modal').innerHTML='';s.skipped++;s.combo=0;s.m=monster(s.stage===3);newQuestion();toast('換個魔法，再試一次！')};$('#manual').onclick=()=>{$('#modal').innerHTML='';if(s.q.type==='oral')finalSpell();else submit(true,true)};$('#close').focus()}
$('#teacher').onclick=teacher;$('#sound').onclick=()=>{cfg.sound=!cfg.sound;hud();if(cfg.sound)sound('coin')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!s?.locked)$('#modal').innerHTML=''});reset();
</script></body></html>
